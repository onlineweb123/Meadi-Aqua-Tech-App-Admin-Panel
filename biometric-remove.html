<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meadi Admin | Remove Biometric</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --danger: #ee5d50; --bg: #f4f7fe; --white: #ffffff; --text: #1b2559; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: var(--white); padding: 35px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(238, 93, 80, 0.1); border: 1px solid #fed7d7; }
        .icon-box { font-size: 50px; margin-bottom: 20px; color: var(--danger); }
        h2 { color: var(--text); margin-bottom: 15px; }
        p { color: #a3aed0; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        .remove-btn { background: var(--danger); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; font-size: 16px; }
        .remove-btn:active { transform: scale(0.98); opacity: 0.9; }
        .back-link { display: block; margin-top: 25px; color: #718096; text-decoration: none; font-size: 14px; font-weight: 600; }
        .status-msg { margin-top: 15px; font-size: 13px; font-weight: 600; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-box">🗑️</div>
    <h2>Remove Fingerprint</h2>
    <p>இந்த சாதனத்தில் (Device) நீங்கள் பதிவு செய்துள்ள கைரேகை லாகின் வசதியை நீக்க வேண்டுமா? நீக்கிய பிறகு நீங்கள் மீண்டும் பாஸ்வேர்ட் மூலமே லாகின் செய்ய முடியும்.</p>
    
    <button id="removeBioBtn" class="remove-btn">Remove My Fingerprint</button>
    
    <div id="status" class="status-msg"></div>
    
    <a href="admin.html" class="back-link">← Cancel & Go Back</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAqyyGJt_t0ztknMudFVLmo6relkEa284g",
        authDomain: "meadi-aqua-tech.firebaseapp.com",
        databaseURL: "https://meadi-aqua-tech-default-rtdb.firebaseio.com",
        projectId: "meadi-aqua-tech"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const statusDiv = document.getElementById("status");

    document.getElementById("removeBioBtn").onclick = async () => {
        // உறுதிப்படுத்துதல் (Confirmation)
        if (!confirm("நிச்சயமாக கைரேகை பதிவை நீக்க வேண்டுமா?")) return;

        try {
            // 1. Firebase-ல் உள்ள பயோமெட்ரிக் டேட்டாவை நீக்குதல்
            await remove(ref(db, 'admin/biometrics'));

            // 2. இந்த போன் மெமரியில் (Local Storage) உள்ள ஐடியை நீக்குதல்
            localStorage.removeItem("bioEnabledId");

            statusDiv.style.color = "#05cd99"; // Success color
            statusDiv.innerText = "வெற்றிகரமாக நீக்கப்பட்டது!";
            statusDiv.style.display = "block";

            alert("கைரேகை பதிவு நீக்கப்பட்டது. இனி நீங்கள் பாஸ்வேர்ட் மூலம் லாகின் செய்யலாம்.");
            
            // அட்மின் பேனலுக்குத் திரும்புதல்
            setTimeout(() => {
                window.location.href = "admin.html";
            }, 1500);

        } catch (err) {
            console.error(err);
            statusDiv.style.color = "var(--danger)";
            statusDiv.innerText = "நீக்குவதில் தோல்வி ஏற்பட்டது.";
            statusDiv.style.display = "block";
            alert("Error: " + err.message);
        }
    };
</script>
</body>
</html>
