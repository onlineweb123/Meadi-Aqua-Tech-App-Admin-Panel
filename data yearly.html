<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Yearly Report | Meadi Aqua Tech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --bg: #f0f4f8; --card: #ffffff; --border: #e2e8f0; --primary: #0077b6; 
            --text-main: #1e293b; --text-sub: #64748b; --success: #10b981; --danger: #ef4444;
            --income-graf: #10b981; --expense-graf: #ef4444;
        }

        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; }

        header { 
            height: 70px; display: flex; align-items: center; justify-content: center; 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
        }

        .header-title { font-size: 18px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

        .main-container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 110px; }

        .year-selector-box { 
            background: white; padding: 15px 20px; border-radius: 16px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .year-label { font-weight: 700; font-size: 15px; color: var(--text-main); }

        select { 
            padding: 10px 15px; border-radius: 12px; border: 2px solid #e2e8f0; 
            font-weight: 700; color: var(--primary); outline: none; background: white;
            font-family: inherit; cursor: pointer; transition: 0.2s;
        }
        select:focus { border-color: var(--primary); }

        .report-card { 
            background: white; border-radius: 24px; border: 1px solid var(--border); 
            padding: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* Graf Container */
        .chart-box { height: 300px; position: relative; }

        /* Table Styles */
        .table-title { font-size: 16px; font-weight: 700; margin: 0 0 15px 0; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 400px; }
        
        th { text-align: left; color: var(--text-sub); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 12px 10px; border-bottom: 2px solid var(--bg); }
        td { padding: 14px 10px; border-bottom: 1px solid #f1f5f9; font-weight: 600; color: var(--text-main); }
        
        .m-name { color: var(--primary); font-weight: 700; }
        .amt-pos { color: var(--success); background: #ecfdf5; padding: 4px 8px; border-radius: 6px; }
        .amt-neg { color: var(--danger); background: #fff1f2; padding: 4px 8px; border-radius: 6px; }

        .total-row { background: #f8fafc; border-top: 2px solid var(--border); }
        .total-row td { font-weight: 800; font-size: 15px; color: var(--text-main); padding: 16px 10px; }

        /* Bottom Navigation */
        .bottom {
            height: 75px; position: fixed; bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom button { background: none; border: none; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; color: var(--text-sub); cursor: pointer; font-family: inherit; }
        .bottom button.active { color: var(--primary); }
        .bottom .icon { font-size: 22px; margin-bottom: 4px; }

        /* Loading Spinner */
        .loader { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--primary); font-size: 14px; font-weight: 600; }

    </style>
</head>
<body>

<header>
    <div class="header-title">Annual Analytics</div>
</header>

<div class="main-container">
    <div class="year-selector-box">
        <span class="year-label">Select Report Year</span>
        <select id="yearSelect"></select>
    </div>

    <div class="report-card">
        <div class="table-title">📈 Income vs Expense Trend</div>
        <div class="chart-box">
            <div class="loader" id="chartLoader">Loading Data...</div>
            <canvas id="yearlyChart"></canvas>
        </div>
    </div>

    <div class="report-card">
        <div class="table-title">🗓️ Monthly Summary</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Income (+)</th>
                        <th>Expense (-)</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    </tbody>
                <tfoot>
                    <tr class="total-row" id="totalRow">
                        </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<div class="bottom">
    <button onclick="location.href='index.html'"><span class="icon">🏠</span>Home</button>
    <button onclick="location.href='service.html'"><span class="icon">⚒️</span>Service</button>
    <button onclick="location.href='store.html'"><span class="icon">🛒</span>Store</button>
    <button onclick="location.href='profile.html'"><span class="icon">👤</span>Profile</button>
</div>

<script type="module">
    // Firebase SDK Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Your Firebase Configuration (Keep it as is)
    const firebaseConfig = {
        apiKey: "AIzaSyAqyyGJt_t0ztknMudFVLmo6relkEa284g",
        authDomain: "meadi-aqua-tech.firebaseapp.com",
        databaseURL: "https://meadi-aqua-tech-default-rtdb.firebaseio.com",
        projectId: "meadi-aqua-tech"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Global Variables
    let allData = [];
    let yearlyChartInstance = null;
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // Function to get active admin name
    async function getActiveAdmin() {
        try {
            const adminSnap = await get(ref(db, 'admin'));
            if (adminSnap.exists()) {
                return adminSnap.val().user;
            }
        } catch (e) { console.error("Admin Fetch Error:", e); }
        return localStorage.getItem("aquaUser") || "Guest";
    }

    // Initialize Page
    async function initPage() {
        document.getElementById('chartLoader').style.display = 'block';
        const admin = await getActiveAdmin();
        
        // Listen to transaction data
        onValue(ref(db, `users/${admin}/transactions`), (snapshot) => {
            if (snapshot.exists()) {
                allData = Object.values(snapshot.val());
                setupYearSelector();
                generateReport();
            } else {
                allData = [];
                renderEmptyState();
            }
            document.getElementById('chartLoader').style.display = 'none';
        });
    }

    // Populate Year Dropdown based on data
    function setupYearSelector() {
        const years = [...new Set(allData.map(d => {
            if(!d.date) return null;
            const parts = d.date.split('/');
            return parts.length > 2 ? parts[2].split(',')[0].trim() : null;
        }))].filter(y => y !== null).sort((a,b)=>b-a);

        const select = document.getElementById("yearSelect");
        const currentYear = new Date().getFullYear().toString();
        
        select.innerHTML = years.map(y => `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}</option>`).join('');
        
        // Fallback if no years found
        if(years.length === 0) select.innerHTML = `<option value="${currentYear}">${currentYear}</option>`;

        select.onchange = generateReport;
    }

    // Main Function to process data and update UI
    function generateReport() {
        const selYear = document.getElementById("yearSelect").value;
        const monthlySummary = Array(12).fill(0).map(() => ({ inc: 0, exp: 0 }));

        allData.forEach(d => {
            if(!d.date) return;
            const parts = d.date.split('/');
            if(parts.length < 3) return;

            const m = parseInt(parts[1]) - 1; // Month is 0-indexed
            const y = parts[2].split(',')[0].trim();

            if(y === selYear && m >= 0 && m < 12) {
                if(d.type === 'income') monthlySummary[m].inc += d.amt;
                else if(d.type === 'expense') monthlySummary[m].exp += d.amt;
            }
        });

        renderTable(monthlySummary);
        renderSmoothChart(monthlySummary);
    }

    // Render Data Table
    function renderTable(data) {
        const tbody = document.getElementById("reportTableBody");
        let grandInc = 0, grandExp = 0;
        
        tbody.innerHTML = data.map((m, i) => {
            const bal = m.inc - m.exp;
            grandInc += m.inc; grandExp += m.exp;
            
            // Skip months with no data to keep table clean (optional)
            if(m.inc === 0 && m.exp === 0) return ''; 

            return `
                <tr>
                    <td class="m-name">${months[i]}</td>
                    <td>₹${m.inc.toLocaleString('en-IN')}</td>
                    <td>₹${m.exp.toLocaleString('en-IN')}</td>
                    <td><span class="${bal >= 0 ? 'amt-pos' : 'amt-neg'}">₹${bal.toLocaleString('en-IN')}</span></td>
                </tr>`;
        }).join('');

        // If no data for the whole year
        if(grandInc === 0 && grandExp === 0) {
             tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-sub);">No records for this year.</td></tr>`;
        }

        // Update Totals
        const totalBal = grandInc - grandExp;
        document.getElementById("totalRow").innerHTML = `
            <td>TOTAL</td>
            <td>₹${grandInc.toLocaleString('en-IN')}</td>
            <td>₹${grandExp.toLocaleString('en-IN')}</td>
            <td><span class="${totalBal >= 0 ? 'amt-pos' : 'amt-neg'}" style="font-weight:800">₹${totalBal.toLocaleString('en-IN')}</span></td>`;
    }

    // ✅ Render Beautiful Smooth Line Chart (The core change)
    function renderSmoothChart(data) {
        const ctx = document.getElementById('yearlyChart').getContext('2d');
        
        // Destroy old chart instance if exists
        if(yearlyChartInstance) yearlyChartInstance.destroy();
        
        // Define colors and gradients
        const incColor = '#10b981'; // Success Green
        const expColor = '#ef4444'; // Danger Red

        // Create Gradients for area fill
        const incGradient = ctx.createLinearGradient(0, 0, 0, 300);
        incGradient.addColorStop(0, 'rgba(16, 185, 129, 0.3)');   
        incGradient.addColorStop(1, 'rgba(16, 185, 129, 0)');

        const expGradient = ctx.createLinearGradient(0, 0, 0, 300);
        expGradient.addColorStop(0, 'rgba(239, 68, 68, 0.2)');   
        expGradient.addColorStop(1, 'rgba(239, 68, 68, 0)');

        // Chart Configuration
        yearlyChartInstance = new Chart(ctx, {
            type: 'line', // Base type is line
            data: {
                labels: months,
                datasets: [
                    {
                        label: 'Income',
                        data: data.map(m => m.inc),
                        borderColor: incColor,
                        backgroundColor: incGradient, // Use gradient fill
                        borderWidth: 3,
                        fill: true, // Fill area under line
                        tension: 0.4, // ✅ THIS MAKES IT SMOOTH (வளைவு)
                        pointBackgroundColor: 'white',
                        pointBorderColor: incColor,
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Expense',
                        data: data.map(m => m.exp),
                        borderColor: expColor,
                        backgroundColor: expGradient, // Use gradient fill
                        borderWidth: 3,
                        fill: true, // Fill area under line
                        tension: 0.4, // ✅ THIS MAKES IT SMOOTH (வளைவு)
                        pointBackgroundColor: 'white',
                        pointBorderColor: expColor,
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                            boxWidth: 8,
                            padding: 15,
                            font: { size: 12, family: 'Plus Jakarta Sans', weight: 600 }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(30, 41, 59, 0.9)',
                        titleFont: { size: 13, family: 'Plus Jakarta Sans' },
                        bodyFont: { size: 13, family: 'Plus Jakarta Sans' },
                        padding: 12,
                        cornerRadius: 10,
                        displayColors: true,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) label += ': ';
                                if (context.parsed.y !== null) {
                                    label += new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(context.parsed.y);
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#f1f5f9' },
                        ticks: {
                            font: { size: 11, family: 'Plus Jakarta Sans' },
                            color: '#94a3b8',
                            callback: function(value) {
                                if (value >= 1000) return '₹' + value/1000 + 'k';
                                return '₹' + value;
                            }
                        }
                    },
                    x: {
                        grid: { display: false },
                        ticks: {
                            font: { size: 11, family: 'Plus Jakarta Sans', weight: 600 },
                            color: '#64748b'
                        }
                    }
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                animation: {
                    duration: 1500,
                    easing: 'easeOutQuart'
                }
            }
        });
    }

    function renderEmptyState() {
        document.getElementById("reportTableBody").innerHTML = `<tr><td colspan="4" style="text-align:center; padding:30px; color:var(--text-sub);">No database found.</td></tr>`;
        if(yearlyChartInstance) yearlyChartInstance.destroy();
    }

    // Start everything
    initPage();

</script>
</body>
</html>
