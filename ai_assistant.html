<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meadi Aqua Tech - AI Assistant</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 15px;
        }
        .user-msg {
            background-color: #0284c7;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            background-color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #1e293b;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: none;
            outline: none;
            background-color: #334155;
            color: white;
            font-size: 15px;
        }
        button {
            padding: 12px 16px;
            border-radius: 50%;
            border: none;
            background-color: #0284c7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button.recording {
            background-color: #ef4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<header>💧 Meadi Aqua Tech AI</header>

<div id="chat-box">
    <div class="msg ai-msg">வணக்கம் மாது! Meadi Aqua Tech டேட்டாபேஸ் பற்றி என்ன தெரிந்து கொள்ள வேண்டும்? கேளுங்கள்.</div>
</div>

<div class="input-area">
    <button id="mic-btn" onclick="startVoice()">🎤</button>
    <input type="text" id="user-input" placeholder="தமிழில் கேள்வி கேளுங்கள்..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
</div>

<script>
    // 1. உங்க Firebase Config விவரங்களை இங்கே போடவும்
    const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. உங்க இலவச Gemini API Key இங்கே போடவும்
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

    // Firebase-லிருந்து மொத்த டேட்டாவையும் எடுக்கும் Function
    async function getFirebaseData() {
        try {
            // உங்க டேட்டாபேஸின் முக்கிய Node பெயரை இங்கே கொடுக்கலாம் (உதா: 'customers' அல்லது '/' முழு டேட்டாவிற்கும்)
            const snapshot = await db.ref('/').once('value');
            return JSON.stringify(snapshot.val());
        } catch (error) {
            console.error("Firebase Error:", error);
            return "டேட்டாபேஸ் தகவல் கிடைக்கவில்லை.";
        }
    }

    // AI-க்கு கேள்வி அனுப்பி பதில் வாங்கும் Function
    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const question = inputField.value.trim();
        if (!question) return;

        addMessage(question, "user-msg");
        inputField.value = "";
        const loadingMsg = addMessage("யோசிக்கிறேன்...", "ai-msg");

        // Firebase டேட்டாவை எடுக்கிறோம்
        const appData = await getFirebaseData();

        const prompt = `
        நீங்கள் 'Meadi Aqua Tech' என்ற RO வாட்டர் ப்யூரிஃபையர் நிறுவனத்தின் உதவியாளர் (AI).
        கீழே கொடுக்கப்பட்டுள்ள JSON டேட்டாபேஸ் தகவல்களை மட்டும் வைத்து, பயனர் கேட்கும் கேள்விக்கு சுருக்கமாகவும், தெளிவாகவும் தமிழில் பதில் சொல்லவும்.
        
        நிறுவனத்தின் டேட்டாபேஸ் விவரங்கள்:
        ${appData}

        பயனரின் கேள்வி: ${question}
        `;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            
            loadingMsg.innerText = reply;
            speakTamil(reply); // பதிலை தமிழில் சத்தமாக வாசிக்கும்
        } catch (err) {
            loadingMsg.innerText = "மன்னிக்கவும், பதில் பெறுவதில் சிக்கல் ஏற்பட்டுள்ளது.";
            console.error(err);
        }
    }

    // Chat திரையில் மெசேஜ் காட்ட
    function addMessage(text, className) {
        const chatBox = document.getElementById("chat-box");
        const div = document.createElement("div");
        div.className = `msg ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    // மைக் மூலம் தமிழில் பேச (Speech-to-Text)
    function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("உங்கள் பிரவுசரில் Voice வசதி இல்லை.");
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'ta-IN';
        const micBtn = document.getElementById("mic-btn");

        recognition.onstart = () => micBtn.classList.add("recording");
        recognition.onend = () => micBtn.classList.remove("recording");

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById("user-input").value = transcript;
            sendMessage();
        };
        recognition.start();
    }

    // AI பதிலை தமிழில் பேச வைக்க (Text-to-Speech)
    function speakTamil(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ta-IN';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
