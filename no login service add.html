<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service Entry | Meadi Aqua Tech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f4f7fa; --card: #ffffff; --border: #e2e8f0; --primary: #0077b6; 
            --text-main: #1e293b; --text-sub: #64748b; --danger: #ef4444;
        }

        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center;
        }

        .form-container {
            background: white; width: 100%; max-width: 500px;
            padding: 20px; border-radius: 20px; border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
        }

        header { text-align: center; margin-bottom: 25px; }
        .header-title { font-size: 20px; font-weight: 700; color: var(--primary); }

        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }

        input, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border);
            border-radius: 12px; outline: none; font-family: inherit;
            box-sizing: border-box; background: #fcfdfe; transition: 0.3s; font-size: 14px;
        }

        input:focus, textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.1); }

        #searchResults {
            position: absolute; width: 100%; background: white; border: 1px solid var(--border);
            border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; margin-top: 5px;
        }
        .search-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .search-item:hover { background: #f0f9ff; color: var(--primary); }

        .selected-cust {
            background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px;
            border-radius: 12px; margin-bottom: 15px; display: none;
        }

        .save-btn {
            width: 100%; padding: 16px; background: var(--primary);
            color: white; border: none; border-radius: 12px;
            font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s;
        }

        .history-card {
            background: white; width: 100%; max-width: 500px;
            padding: 20px; border-radius: 20px; border: 1px solid var(--border);
            display: none; box-sizing: border-box;
        }
        .history-item {
            padding: 12px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        .history-text { font-size: 13px; color: var(--text-main); flex: 1; }
        .del-btn {
            background: #fee2e2; color: var(--danger); border: none;
            padding: 6px 10px; border-radius: 8px; font-size: 11px;
            font-weight: 600; cursor: pointer; margin-left: 10px;
        }
        .del-btn:hover { background: var(--danger); color: white; }

        .back-btn { margin-top: 20px; color: var(--text-sub); text-decoration: none; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-container">
    <header>
        <div class="header-title">Service Entry</div>
        <p style="font-size: 12px; color: var(--text-sub); margin-top: 5px;">Record & Manage Service History</p>
    </header>

    <div class="form-group">
        <label>Search Customer (No Logon Folder)</label>
        <input type="text" id="searchBox" placeholder="Type Name or Phone..." onkeyup="searchCustomer()">
        <div id="searchResults"></div>
    </div>

    <div id="selectedInfo" class="selected-cust">
        <div id="custDisplay" style="font-weight: 700; color: #166534;"></div>
        <div id="modelDisplay" style="font-size: 12px; color: #166534;"></div>
    </div>

    <div id="serviceSection" style="display:none;">
        <div class="form-group">
            <label>Service Date</label>
            <input type="date" id="serviceDate">
        </div>
        <div class="form-group">
            <label>Details</label>
            <textarea id="serviceNote" rows="3" placeholder="Work done details..."></textarea>
        </div>
        <button id="saveBtn" class="save-btn" onclick="addService()">Save Service</button>
    </div>
</div>

<div id="historySection" class="history-card">
    <h3 style="font-size: 15px; color: var(--text-main); margin-bottom: 15px;">Previous Services</h3>
    <div id="historyList"></div>
</div>

<div class="back-btn" onclick="window.history.back()">← Go Back</div>

<script>
    // Firebase Path - 'No Logon Customar' ஃபோல்டருக்கு மாற்றப்பட்டுள்ளது
    const DB_URL = "https://meadi-aqua-tech-default-rtdb.firebaseio.com/No Logon Customar";
    let customersData = {}; 
    let selectedFbKey = null;

    document.getElementById('serviceDate').valueAsDate = new Date();

    async function loadCustomers() {
        try {
            const response = await fetch(`${DB_URL}.json`);
            customersData = await response.json() || {};
        } catch (e) { console.error("Error loading customers:", e); }
    }

    async function searchCustomer() {
        if (Object.keys(customersData).length === 0) await loadCustomers();
        const query = document.getElementById('searchBox').value.toLowerCase();
        const resultsDiv = document.getElementById('searchResults');

        if (query.length < 1) { resultsDiv.style.display = 'none'; return; }

        let html = '';
        for (let key in customersData) {
            let c = customersData[key];
            if (c.name && (c.name.toLowerCase().includes(query) || (c.phone && c.phone.includes(query)))) {
                html += `<div class="search-item" onclick="selectCust('${key}')">
                            <strong>${c.name}</strong> - ${c.phone || ''}<br>
                            <small>${c.model || 'No Model'}</small>
                         </div>`;
            }
        }
        resultsDiv.innerHTML = html || '<div class="search-item">No results found</div>';
        resultsDiv.style.display = 'block';
    }

    function selectCust(key) {
        selectedFbKey = key;
        const c = customersData[key];
        document.getElementById('searchBox').value = c.name;
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('selectedInfo').style.display = 'block';
        document.getElementById('custDisplay').innerText = c.name;
        document.getElementById('modelDisplay').innerText = "Machine: " + (c.model || "N/A");
        document.getElementById('serviceSection').style.display = 'block';

        showHistory(c.history);
    }

    function showHistory(historyStr) {
        const historySection = document.getElementById('historySection');
        const listDiv = document.getElementById('historyList');
        listDiv.innerHTML = "";

        if (!historyStr || historyStr.includes("No service")) {
            historySection.style.display = 'none';
            return;
        }

        historySection.style.display = 'block';
        const records = historyStr.split('\n').filter(r => r.trim() !== "");

        records.forEach((rec, index) => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-text">${rec}</div>
                <button class="del-btn" onclick="deleteHistoryItem(${index})">Delete</button>
            `;
            listDiv.appendChild(item);
        });
    }

    async function addService() {
        const date = document.getElementById('serviceDate').value;
        const note = document.getElementById('serviceNote').value.trim();
        if (!selectedFbKey || !note) return alert("Please fill all details!");

        let currentHistory = customersData[selectedFbKey].history || "";
        if (currentHistory.includes("No service")) currentHistory = "";

        const newEntry = `[${date}] ${note}`;
        // புதிய என்ட்ரி மேலே வருமாறு (Newest First)
        const updatedHistory = currentHistory ? `${newEntry}\n${currentHistory}` : newEntry;

        updateFirebase(updatedHistory);
    }

    async function deleteHistoryItem(index) {
        if (!confirm("Are you sure you want to delete this record?")) return;

        let records = customersData[selectedFbKey].history.split('\n').filter(r => r.trim() !== "");
        records.splice(index, 1);

        const updatedHistory = records.join('\n') || "No service history available.";
        updateFirebase(updatedHistory);
    }

    async function updateFirebase(historyText) {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = "Saving...";

        try {
            // குறிப்பிட்ட Key-ல் மட்டும் Update (PATCH) செய்யப்படுகிறது
            const res = await fetch(`${DB_URL}/${selectedFbKey}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ history: historyText }),
                headers: { 'Content-Type': 'application/json' }
            });

            if (res.ok) {
                alert("Service record updated successfully!");
                location.reload();
            } else {
                throw new Error("Failed to update");
            }
        } catch (e) { 
            alert("Error updating cloud database.");
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerText = "Save Service";
        }
    }

    loadCustomers();
</script>

</body>
</html>
