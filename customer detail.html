<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Explorer | Meadi Aqua Tech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f4f7fa; --card: #ffffff; --border: #e2e8f0; --primary: #0077b6; 
            --text-main: #1e293b; --text-sub: #64748b; --accent: #00b4d8; --sidebar-w: 280px;
            --danger: #ef4444; --success: #10b981;
        }

        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); height: 100vh; overflow: hidden; display: flex; }

        /* Sidebar Styles */
        .sidebar { 
            width: var(--sidebar-w); height: 100%; background: white; 
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            transition: 0.3s ease; position: relative; z-index: 1000;
        }
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); }
        .side-search { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); outline: none; font-size: 14px; box-sizing: border-box; transition: 0.3s; }
        .side-search:focus { border-color: var(--primary); background: #f0f9ff; }

        .alphabet-list { flex: 1; overflow-y: auto; padding: 10px; background: #fafbfc; }

        .alpha-folder { margin-bottom: 8px; }
        .folder-header { 
            padding: 10px 15px; background: #fff; border-radius: 10px;
            font-weight: 700; color: var(--primary); cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border); margin-bottom: 2px;
        }
        .cust-sub-list { display: none; flex-direction: column; gap: 4px; padding: 5px 0 10px 5px; }

        .cust-item-link { 
            padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; 
            border: 1px solid transparent; display: block;
        }
        .cust-item-link:hover { background: #e0f2fe; border-color: #bae6fd; }
        .cust-name { font-size: 14px; font-weight: 600; color: var(--text-main); display: block; }
        .cust-meta { font-size: 11px; color: var(--text-sub); display: block; margin-top: 2px; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        header { height: 65px; display: flex; align-items: center; justify-content: center; background: white; border-bottom: 1px solid var(--border); position: relative; }
        .menu-toggle { position: absolute; left: 15px; font-size: 20px; background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; display: none; }

        .main-scroll { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }

        /* Profile & Cards */
        .profile-section { background: white; border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-weight: 700; color: var(--primary); margin-bottom: 15px; font-size: 11px; text-transform: uppercase; border-bottom: 1px dashed var(--border); padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }

        .profile-img { width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; margin-bottom: 10px; }

        .progress-container { height: 10px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); transition: 1s; width: 0%; }

        .amc-badge { display: inline-block; padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; margin-top: 5px; }
        .status-active { background: #dcfce7; color: var(--success); }
        .status-expired { background: #fee2e2; color: var(--danger); }
        .status-none { background: #f1f5f9; color: var(--text-sub); }

        .detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .label { color: var(--text-sub); }
        .value { color: var(--text-main); font-weight: 600; text-align: right; }

        .history-item { background: #f8fafc; border-left: 4px solid var(--accent); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .h-date { display: inline-block; background: var(--primary); color: white; padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 700; margin-bottom: 4px; }


        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; width: 280px; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
            .sidebar.open { left: 0; }
            .menu-toggle { display: block; }
            .bottom { left: 0; }
            .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999; }
            .overlay.active { display: block; }
        }


        /* BOTTOM NAVIGATION */
        .bottom {
            height: 75px; position: fixed; bottom: 0; left: 0; right: 0; 
            display: flex; justify-content: space-around; align-items: center; 
            background: white; backdrop-filter: blur(12px);
            border-top: 1px solid var(--border); z-index: 100; padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom button {
            background: none; border: none; font-size: 11px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; color: var(--text-sub);
            cursor: pointer;
        }
        .bottom button.active { color: var(--primary); }
        .bottom .icon { font-size: 22px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <input type="text" class="side-search" id="sideSearch" placeholder="Name / ID / Phone..." onkeyup="filterSidebar()">
        </div>
        <div class="alphabet-list" id="alphabetList">
            <div id="loader" style="padding: 20px; text-align: center; color: var(--primary);">Loading...</div>
        </div>
    </div>

    <div class="main-content">
        <header>
            <button class="menu-toggle" id="menuBtn">☰</button>
            <div class="header-title">Customer Explorer</div>
        </header>

        <div class="main-scroll" id="mainDisplay">
            <div style="text-align: center; margin-top: 60px; color: var(--text-sub);">
                <span style="font-size: 40px;">🔍</span>
                <p>Search using Name or Phone <br>from the sidebar.</p>
            </div>
        </div>

<div class="bottom">
    <button onclick="location.href='index.html'"><span class="icon">🏠</span>Home</button>
    <button onclick="location.href='customer detail.html'"><span class="icon">📒</span>Customer</button>
    <button onclick="location.href='service list.html'"><span class="icon">👨‍🔧</span>Service</button>
    <button onclick="location.href='control profile.html'"><span class="icon">⚙️</span>Settings</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAqyyGJt_t0ztknMudFVLmo6relkEa284g",
        authDomain: "meadi-aqua-tech.firebaseapp.com",
        databaseURL: "https://meadi-aqua-tech-default-rtdb.firebaseio.com",
        projectId: "meadi-aqua-tech",
        storageBucket: "meadi-aqua-tech.firebasestorage.app",
        messagingSenderId: "531151217708",
        appId: "1:531151217708:web:b30b6e1a0bf7fa60f29d89"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let allUsersData = {};

    const alphaListDiv = document.getElementById("alphabetList");
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    menuBtn.onclick = () => { sidebar.classList.add("open"); overlay.classList.add("active"); };
    overlay.onclick = () => { sidebar.classList.remove("open"); overlay.classList.remove("active"); };

    // தேதி வடிவமைப்பு உதவி (dd/mm/yyyy)
    function formatDate(dateStr) {
        if (!dateStr || dateStr === "N/A" || dateStr === "Not Updated") return "N/A";
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr; 
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
    }

    async function loadData() {
        try {
            const snap = await get(child(ref(db), 'users'));
            if (snap.exists()) {
                allUsersData = snap.val();
                renderList(allUsersData);
            } else {
                alphaListDiv.innerHTML = "No customers found.";
            }
        } catch (e) {
            alphaListDiv.innerHTML = "Error loading data.";
        }
    }

    function renderList(data) {
        alphaListDiv.innerHTML = "";
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        letters.forEach(L => {
            const filteredKeys = Object.keys(data).filter(k => {
                const name = data[k].name || "";
                return name.trim().toUpperCase().startsWith(L);
            });

            if(filteredKeys.length > 0) {
                const folder = document.createElement("div");
                folder.className = "alpha-folder";
                folder.innerHTML = `
                    <div class="folder-header" onclick="toggleFolder(this)">
                        <span>${L}</span><span>${filteredKeys.length}</span>
                    </div>
                    <div class="cust-sub-list">
                        ${filteredKeys.sort((a,b) => data[a].name.localeCompare(data[b].name))
                            .map(k => `
                                <div class="cust-item-link" data-search="${data[k].name} ${k} ${data[k].phone || ''}" onclick="viewUser('${k}')">
                                    <span class="cust-name">${data[k].name}</span>
                                    <span class="cust-meta">ID: ${k} | 📞 ${data[k].phone || 'No Phone'}</span>
                                </div>`).join('')}
                    </div>`;
                alphaListDiv.appendChild(folder);
            }
        });
    }

    window.toggleFolder = (el) => {
        const list = el.nextElementSibling;
        list.style.display = (list.style.display === 'flex') ? 'none' : 'flex';
    };

    window.filterSidebar = () => {
        const val = document.getElementById("sideSearch").value.toLowerCase();
        const folders = document.querySelectorAll(".alpha-folder");

        folders.forEach(folder => {
            const items = folder.querySelectorAll(".cust-item-link");
            let hasMatch = false;

            items.forEach(item => {
                const searchText = item.getAttribute("data-search").toLowerCase();
                if (searchText.includes(val)) {
                    item.style.display = "block";
                    hasMatch = true;
                } else {
                    item.style.display = "none";
                }
            });

            const subList = folder.querySelector(".cust-sub-list");
            if (val !== "" && hasMatch) {
                subList.style.display = "flex"; 
                folder.style.display = "block";
            } else if (val !== "" && !hasMatch) {
                folder.style.display = "none";
            } else {
                subList.style.display = "none";
                folder.style.display = "block";
            }
        });
    };

    window.viewUser = (username) => {
        const user = allUsersData[username];
        const display = document.getElementById("mainDisplay");
        if(window.innerWidth < 768) {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        }

        let filterHtml = "";
        if(user.lastFilterDate) {
            const nextDue = new Date(user.lastFilterDate);
            nextDue.setMonth(nextDue.getMonth() + 3);
            const today = new Date();
            const diff = Math.ceil((nextDue - today) / (1000 * 60 * 60 * 24));
            let percent = Math.max(0, Math.min(100, ((90 - diff) / 90) * 100));
            filterHtml = `
                <p style="font-size:13px; margin:0;">Next Change: <b>${formatDate(nextDue)}</b></p>
                <div class="progress-container"><div class="progress-bar" style="width:${percent}%; background:${diff < 0 ? 'var(--danger)' : ''}"></div></div>
                <small>${diff < 0 ? '⚠️ Maintenance Overdue!' : diff + ' Days remaining'}</small>`;
        } else { filterHtml = "<p style='color:gray; font-size:12px;'>No records.</p>"; }

        let amcStatus = "NO PLAN", amcClass = "status-none", amcDate = "Not Available";
        if(user.lastAMCDate) {
            const expiry = new Date(user.lastAMCDate);
            expiry.setFullYear(expiry.getFullYear() + 1);
            amcDate = formatDate(expiry);
            if(new Date() > expiry) { amcStatus = "EXPIRED"; amcClass = "status-expired"; }
            else { amcStatus = "ACTIVE"; amcClass = "status-active"; }
        }

        display.innerHTML = `
            <div class="profile-section" style="text-align:center;">
                <div class="profile-img">${(user.name || "U")[0].toUpperCase()}</div>
                <h2 style="margin:0; font-size:20px;">${user.name}</h2>
                <div style="font-size:13px; color:var(--text-sub);">ID: ${username}</div>
            </div>

            <div class="profile-section">
                <div class="section-title">📊 Filter Maintenance</div>
                ${filterHtml}
            </div>

            <div class="profile-section">
                <div class="section-title">🛡️ AMC Status</div>
                <div class="detail-row"><span class="label">Expiry Date</span><span class="value">${amcDate}</span></div>
                <div class="amc-badge ${amcClass}">${amcStatus}</div>
            </div>

            <div class="profile-section">
                <div class="section-title">📱 Contact & Machine</div>
                <div class="detail-row"><span class="label">Phone</span><span class="value">${user.phone || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Model</span><span class="value">${user.model || 'N/A'}</span></div>
                <div class="detail-row"><span class="label">Warranty</span><span class="value" style="color:var(--danger)">${user.warranty || 'N/A'}</span></div>
                <div class="detail-row" style="flex-direction:column; gap:5px; margin-top:10px;">
                    <span class="label">Address:</span>
                    <span class="value" style="text-align:left;">${user.address || 'N/A'}</span>
                </div>
            </div>

            <div class="profile-section">
                <div class="section-title">🛠️ Service History</div>
                ${renderHistory(user.history)}
            </div>
            
            <button class="nav-btn" style="width:100%; padding:15px; background:white; border:2px solid var(--border); border-radius:15px; margin-bottom:30px; font-weight:700;" onclick="window.print()">🖨 Print Profile</button>
        `;
    };

    function renderHistory(history) {
        let historyArray = [];
        if (history) {
            historyArray = Array.isArray(history) ? history : Object.values(history);
        }

        if(!historyArray.length) return "<p style='font-size:12px; color:gray;'>No records found.</p>";

        // தேதி அடிப்படையில் புதியது முதலில் வரும்படி வரிசைப்படுத்துதல் (Descending Order)
        const sortedHistory = [...historyArray].sort((a, b) => {
            const dateA = new Date(a.date);
            const dateB = new Date(b.date);
            return dateB - dateA;
        });

        return sortedHistory.map(i => `
            <div class="history-item">
                <div>
                    <span class="h-date">${formatDate(i.date)}</span>
                    <div style="font-size:13px; font-weight:700; color:var(--text-main);">${i.type}</div>
                </div>
                <span style="font-size:11px; color:var(--success); font-weight:700; background:#dcfce7; padding:4px 8px; border-radius:8px;">Done</span>
            </div>`).join('');
    }

    loadData();
</script>
</body>
</html>
