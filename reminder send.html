<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reminder | Meadi Aqua Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
        }

        .container { 
            width: 100%;
            max-width: 450px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        }

        h2 { 
            text-align: center; 
            color: #4a4a4a; 
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 24px;
        }

        .input-group { margin-bottom: 20px; }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: #666; 
            font-weight: 500;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px 15px; 
            border: 2px solid #eee; 
            border-radius: 10px; 
            outline: none; 
            transition: 0.3s;
            font-size: 15px;
            background: #fdfdfd;
        }

        input:focus, textarea:focus { 
            border-color: #764ba2; 
            background: #fff;
            box-shadow: 0 0 8px rgba(118, 75, 162, 0.2);
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(to right, #667eea, #764ba2); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
        }

        button:active { transform: translateY(0); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #764ba2;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔔 Reminder Note</h2>
    
    <div class="input-group">
        <label>Customer Name</label>
        <input type="text" id="custName" placeholder="Enter customer name" required>
    </div>

    <div class="input-group">
        <label>Phone Number</label>
        <input type="tel" id="custPhone" placeholder="Enter phone number" required>
    </div>

    <div class="input-group">
        <label>Notes / Requirements</label>
        <textarea id="custNote" placeholder="e.g., Call back next week for RO service..." rows="3"></textarea>
    </div>

    <div class="input-group">
        <label>Reminder Date</label>
        <input type="date" id="reminderDate">
    </div>
    
    <button onclick="saveReminder()">Save Reminder</button>
    
    <a href="reminder view.html" class="back-link">View All Reminders →</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://meadi-aqua-tech-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function saveReminder() {
        const btn = document.querySelector('button');
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const note = document.getElementById('custNote').value;
        const date = document.getElementById('reminderDate').value;

        if(!name || !phone || !date) {
            alert("Please fill in all mandatory fields!");
            return;
        }

        btn.innerText = "Saving...";
        btn.disabled = true;

        database.ref('reminders_list').push({
            customer_name: name,
            phone_number: phone,
            note: note,
            reminder_date: date,
            timestamp: Date.now()
        }).then(() => {
            alert("Reminder saved successfully! ✅");
            // Clear Form
            document.getElementById('custName').value = "";
            document.getElementById('custPhone').value = "";
            document.getElementById('custNote').value = "";
            document.getElementById('reminderDate').value = "";
        }).catch((error) => {
            alert("Error: " + error.message);
        }).finally(() => {
            btn.innerText = "Save Reminder";
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
