<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ஜார்விஸ்</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Noto Sans Tamil', sans-serif;
    background: radial-gradient(circle at top, #0f2027, #050a10);
    color: #e6f1ff;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px;
    text-align: center;
    font-size: 1.4rem;
    letter-spacing: 3px;
    color: #4fd1ff;
    border-bottom: 1px solid rgba(79,209,255,0.25);
    background: rgba(255,255,255,0.03);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #0e5a7a; }
  .bot {
    align-self: flex-start;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(79,209,255,0.2);
  }
  .bot button.speak {
    display: block;
    margin-top: 8px;
    background: none;
    border: none;
    color: #4fd1ff;
    cursor: pointer;
    font-size: 1.1rem;
  }
  #status { text-align: center; font-size: 0.8rem; color: #7fa6b8; padding: 4px; }
  #bar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(79,209,255,0.25);
    background: rgba(255,255,255,0.03);
  }
  #q {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(79,209,255,0.3);
    background: rgba(0,0,0,0.3);
    color: #e6f1ff;
    font-size: 1rem;
  }
  .btn {
    padding: 0 14px;
    border: none;
    border-radius: 12px;
    background: #4fd1ff;
    color: #05202c;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .btn.listening { background: #ff5c7a; color: #fff; }
  .btn.off { background: #333; color: #aaa; }
</style>
</head>
<body>
<header>J.A.R.V.I.S</header>
<div id="chat"></div>
<div id="status">தரவு ஏற்றப்படுகிறது...</div>
<div id="bar">
  <button class="btn" id="mic" title="பேசு">🎤</button>
  <input id="q" placeholder="கேள்வியை தட்டச்சு செய்யவும்..." autocomplete="off">
  <button class="btn" id="send" title="அனுப்பு">➤</button>
  <button class="btn off" id="auto" title="தானாக பேசு">🔊</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { CONFIG } from "./config.js";

const GROQ_KEY = CONFIG.groqKey;
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "openai/gpt-oss-120b"; // இன்னும் வேகம் வேண்டுமானால்: "llama-3.1-8b-instant"
const MAX_DATA_CHARS = 8000;

const app = initializeApp(CONFIG.firebaseConfig);
const db = getDatabase(app);

let liveData = {};
const chat = document.getElementById("chat");
const qBox = document.getElementById("q");
const statusEl = document.getElementById("status");
const micBtn = document.getElementById("mic");
const autoBtn = document.getElementById("auto");
let autoSpeak = false;
let history = []; // முந்தைய கேள்வி பதில்களை நினைவில் வைக்க

// ரியல்டைம் டேட்டா
onValue(ref(db, "/"), (snap) => {
  liveData = snap.val() || {};
  statusEl.textContent = "தரவு தயார் ✓ (நேரடியாக புதுப்பிக்கப்படும்)";
}, (err) => {
  statusEl.textContent = "ஃபயர்பேஸ் பிழை: " + err.message;
});

function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  if (who === "bot") {
    const b = document.createElement("button");
    b.className = "speak";
    b.textContent = "🔊 படி";
    b.onclick = () => speak(text);
    d.appendChild(b);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

// ====== பேச்சு → எழுத்து ======
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = "ta-IN";
  rec.interimResults = true;
  rec.onresult = (e) => {
    let t = "";
    for (const r of e.results) t += r[0].transcript;
    qBox.value = t;
  };
  rec.onend = () => micBtn.classList.remove("listening");
  rec.onerror = () => micBtn.classList.remove("listening");
}
micBtn.onclick = () => {
  if (!rec) { alert("இந்த உலாவி குரல் உள்ளீட்டை ஆதரிக்கவில்லை. Chrome பயன்படுத்தவும்."); return; }
  micBtn.classList.add("listening");
  rec.start();
};

// ====== எழுத்து → பேச்சு ======
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ta-IN";
  speechSynthesis.speak(u);
}
autoBtn.onclick = () => {
  autoSpeak = !autoSpeak;
  autoBtn.classList.toggle("off", !autoSpeak);
};

// ====== கேள்வி கேட்டல் ======
async function ask() {
  const question = qBox.value.trim();
  if (!question) return;
  qBox.value = "";
  addMsg(question, "user");
  const thinking = addMsg("யோசிக்கிறேன்...", "bot");

  let dataText = JSON.stringify(liveData);
  if (dataText.length > MAX_DATA_CHARS) dataText = dataText.slice(0, MAX_DATA_CHARS) + "...(சுருக்கப்பட்டது)";

  const system =
    "நீ ஜார்விஸ், ஒரு தனிப்பட்ட உதவியாளர். கீழே உள்ள தரவை மட்டும் பயன்படுத்தி பயனரின் கேள்விக்கு தமிழில் சுருக்கமாக பதில் சொல். " +
    "தரவில் பதில் இல்லையென்றால் 'என்னிடம் அந்த தகவல் இல்லை' என்று சொல்.\n\nதரவு:\n" + dataText;

  try {
    const res = await fetch(GROQ_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        temperature: 0.3,
        messages: [
          { role: "system", content: system },
          ...history.slice(-6),
          { role: "user", content: question }
        ]
      })
    });
    const out = await res.json();
    thinking.remove();
    if (!res.ok) {
      addMsg("குரோக் பிழை: " + (out.error?.message || res.status), "bot");
      return;
    }
    const answer = out.choices?.[0]?.message?.content || "பதில் கிடைக்கவில்லை.";
    history.push({ role: "user", content: question }, { role: "assistant", content: answer });
    addMsg(answer, "bot");
    if (autoSpeak) speak(answer);
  } catch (err) {
    thinking.remove();
    addMsg("இணைப்பு பிழை. இணையம் இருக்கிறதா என்று சரிபார்க்கவும்.", "bot");
  }
}

document.getElementById("send").onclick = ask;
qBox.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

addMsg("வணக்கம்! நான் ஜார்விஸ். உங்கள் தரவைப் பற்றி என்ன வேண்டுமானாலும் கேளுங்கள்.", "bot");
</script>
</body>
</html>
